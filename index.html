    <link rel="stylesheet" href="styles.css">

</head>

<body>
    <div class="header">
        <h1>Pixelated Icon Generator</h1>
        <p>Create your pixelated SVG for free.</p>
    </div>
    <div class="main-wrapper">
        <div class="main-content">

            <div class="toolbar">
                <button class="picker edit-group" data-tool="picker" title="Eyedropper (p)">
                    <span class="icon icon-picker"></span>
                </button>
                <div class="color-picker-wrapper" title="Pick Color">
                    <input type="color">
                </div>
                <div class="color-history" title="Color History"></div>
                <button class="draw edit-group active" data-tool="draw" title="Draw (d)">
                    <span class="icon icon-pen"></span>
                </button>
                <button class="rainbow edit-group" data-tool="rainbow" title="Rainbow (r)">
                    <span class="icon icon-rainbow"></span>
                </button>
                <button class="fill edit-group" data-tool="fill" title="Fill (f)">
                    <span class="icon icon-fill"></span>
                </button>
                <button class="erase edit-group" data-tool="erase" title="Erase (e)">
                    <span class="icon icon-eraser"></span>
                </button>
                <button class="darken edit-group" data-tool="darken" title="Darken">
                    <span class="icon icon-darken"></span>
                </button>
                <button class="brighten edit-group" data-tool="brighten" title="Brighten">
                    <span class="icon icon-brighten"></span>
                </button>
                <button class="rotate" title="Rotate">
                    <span class="icon icon-rotate"></span>
                </button>
                <button class="mirror" title="Mirror">
                    <span class="icon icon-mirror"></span>
                </button>
                <button class="move edit-group" data-tool="move" title="Move">
                    <span class="icon icon-move"></span>
                </button>
                <button class="bg-fill" title="Fill Background">
                    <span class="icon icon-bg-fill"></span>
                </button>
                <button class="draw-x" title="Mirror vertically (Top/Bottom)">
                    <span class="icon icon-draw-x"></span>
                </button>
                <button class="draw-y" title="Mirror horizontally (Left/Right)">
                    <span class="icon icon-draw-y"></span>
                </button>
            </div>

            <div class="workspace">
                <div class="actionbar">
                    <div class="action-group">
                        <button class="undo" title="Undo"><span class="icon icon-undo"></span></button>
                        <button class="redo" title="Redo"><span class="icon icon-redo"></span></button>
                    </div>
                    <div class="divider vertical"></div>
                    <div class="action-group">
                        <button class="grid active" title="Toggle Grid"><span class="icon icon-grid"></span></button>
                        <button class="clear" title="Clear Canvas"><span class="icon icon-delete"></span></button>
                    </div>
                    <div class="divider vertical"></div>
                    <div class="action-group">
                        <button class="save" title="Save"><span class="icon icon-save"></span></button>
                        <button class="gallery" title="Gallery"><span class="icon icon-gallery"></span></button>
                        <button class="download" title="Download SVG"><span class="icon icon-download"></span></button>
                        <button class="generate-svg" title="Generate SVG Code"><span
                                class="icon icon-svg"></span></button>
                    </div>
                    <div class="action-group push-right">
                        <button class="welcome" title="Help/Welcome"><span class="icon icon-welcome"></span></button>
                    </div>
                </div>

                <div class="grid-container grid-active"></div>
                <div class="gallery-container close"></div>
            </div>
        </div>

        <div class="grid-size-container">
            <button class="grid-size-minus">–</button>
            <span class="grid-size">16 x 16</span>
            <button class="grid-size-plus">+</button>
        </div>
    </div>

    <div class="svg-container">
        <fieldset class="svg-code-wrapper close">
            <legend>SVG Output</legend>
            <code class="svg-output"></code>
            <button class="copy-svg"><span class="icon icon-copy"></span></button>
        </fieldset>
        <div class="svg-links-container">
            <span class="links-wrapper">
                <a href="https://svgomg.net/" target="_blank" rel="noopener noreferrer">1. Compress your SVG</a>
                <a href="https://yoksel.github.io/url-encoder/" target="_blank" rel="noopener noreferrer">2. Use it in
                    CSS</a>
            </span>
            <p>(Not affiliated, but open source)</p>
        </div>
    </div>
    <div class="footer">
        <p class="tribute">Icons by <a href="https://phosphoricons.com/" target="_blank"
                rel="noopener noreferrer">Phosphor</a></p>
        <span><a href="https://github.com/strecke/pixelated-icon-generator" target="_blank"
                rel="noopener noreferrer"><span class="icon icon-github"></span>Contribute on GitHub</a></span>
    </div>
</body>

</html>
